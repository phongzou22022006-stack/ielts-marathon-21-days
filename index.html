<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>IELTS Marathon 21 Days - Tự học có kiểm soát</title>
  <meta name="description" content="Nền tảng tự học IELTS 21 ngày chuyển thể từ IELTS Marathon 21-Day Companion với đầy đủ module Listening mới, bằng chứng xác thực và quy tắc bản đầu bất biến.">
  <meta name="theme-color" content="#c2410c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  
  <!-- Google Fonts: Plus Jakarta Sans (Display), Inter (Body), Newsreader (Editorial), JetBrains Mono (Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            canvas: 'var(--canvas)',
            surface: 'var(--surface)',
            'surface-muted': 'var(--surface-muted)',
            'ink-primary': 'var(--ink-primary)',
            'ink-secondary': 'var(--ink-secondary)',
            'ink-muted': 'var(--ink-muted)',
            'border-subtle': 'var(--border-subtle)',
            'border-strong': 'var(--border-strong)',
            terracotta: 'var(--accent-terracotta)',
            sage: 'var(--accent-sage)',
            amber: 'var(--accent-amber)',
          }
        }
      }
    };
  </script>

  <!-- Custom Design Tokens & Emil Kowalski Animations -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col pb-16 md:pb-0">
  <!-- Top Navigation Header -->
  <header id="app-header" class="editorial-card rounded-none border-t-0 border-x-0 sticky top-0 z-40 px-3 sm:px-6 py-2.5 sm:py-3 bg-[var(--surface)] backdrop-blur-md bg-opacity-95 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 sm:gap-4">
      <div class="flex items-center gap-3">
<div onclick="window.app.navigateTo('dashboard')" class="cursor-pointer flex items-center gap-2 select-none" title="Về Lộ trình chính">
          <div id="brand-days" class="w-8 h-8 rounded-lg bg-[var(--accent-terracotta)] text-white flex items-center justify-center font-display font-extrabold text-sm shadow-sm transition-colors duration-200">21</div>
          <div>
            <span class="font-display font-extrabold text-xs sm:text-base tracking-tight block text-[var(--ink-primary)]">IELTS MARATHON</span>
            <span id="brand-subtitle" class="text-[9px] sm:text-[10px] font-mono text-[var(--ink-secondary)] block -mt-1 tracking-wider uppercase">LỘ TRÌNH 21 NGÀY</span>
          </div>
        </div>

<nav class="hidden md:flex items-center gap-1 ml-4 pl-4 border-l border-[var(--border-subtle)] text-xs font-semibold">
          <button data-nav="dashboard" class="btn btn-ghost text-xs px-2.5 py-1.5">🗺️ Lộ trình</button>
          <button data-nav="day-detail" class="btn btn-ghost text-xs px-2.5 py-1.5">📖 Ngày học</button>
          <button data-nav="error-log" class="btn btn-ghost text-xs px-2.5 py-1.5">🎯 Nhật ký lỗi</button>
          <button data-nav="portfolio" class="btn btn-ghost text-xs px-2.5 py-1.5">📁 Hồ sơ Portfolio</button>
          <button data-nav="checkpoint" class="btn btn-ghost text-xs px-2.5 py-1.5">⭐ Checkpoints</button>
          <button data-nav="review" class="btn btn-ghost text-xs px-2.5 py-1.5">🔁 Ôn từ</button>
          <button data-nav="mock-test" id="nav-mock-test" class="btn btn-ghost text-xs px-2.5 py-1.5 text-[var(--accent-terracotta)]">🎯 Thi thử Ngày 20</button>
        </nav>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Track Switcher -->
        <select id="track-select" onchange="window.app.setTrack(this.value)"
                class="block text-[11px] sm:text-xs bg-[var(--surface-muted)] px-1.5 sm:px-2 py-1.5 rounded-lg border border-[var(--border-subtle)] font-mono font-bold text-[var(--accent-terracotta)] outline-none cursor-pointer">
          <option value="ielts21">21 Ngày</option>
          <option value="foundation14">Nền tảng 14</option>
        </select>

<!-- Floating Timer Pill -->
        <div class="timer-pill text-xs py-1 px-2.5 sm:px-3.5 cursor-pointer select-none" 
             onclick="window.app.timerRunning ? window.app.pauseTimer() : window.app.startTimer()" 
             title="Nhấp để bắt đầu hoặc tạm dừng đếm lùi" role="button" tabindex="0" aria-label="Bộ đếm thời gian - bấm để bắt đầu hoặc tạm dừng">
          <span>⏱️</span>
          <span class="app-timer-display font-mono font-bold">90:00</span>
        </div>

        <!-- Streak Badge -->
        <div class="hidden sm:inline-flex badge badge-sage font-mono text-xs py-1 px-2.5" id="streak-header-badge">
          🔥 3 ngày
        </div>

<!-- Theme Toggle -->
        <button id="theme-toggle-btn" onclick="window.app.toggleTheme()" class="btn btn-secondary text-xs py-1 px-2 sm:px-2.5" title="Đổi chế độ Sáng / Tối" aria-label="Đổi chế độ Sáng / Tối">
          🌙 Tối
        </button>

        <!-- Settings Button -->
        <button onclick="window.app.navigateTo('settings')" class="btn btn-ghost p-1.5 text-sm" title="Cài đặt" aria-label="Mở Cài đặt">
          ⚙️
        </button>
      </div>
    </div>
  </header>

<!-- Main View Root -->
  <main id="app-root" class="flex-1"></main>

  <!-- Sticky Action Bar (Wave 1 P0) -->
  <div id="sticky-action-bar" class="sticky-action-bar" role="navigation" aria-label="Hành động nhanh">
    <button id="action-prev" class="btn btn-secondary text-xs" onclick="window.app.navigatePrevDay()">← Trước</button>
    <span class="action-status" id="action-status">Bước 1/8</span>
    <button id="action-next" class="btn btn-primary text-xs" onclick="window.app.navigateNextDay()">Tiếp →</button>
  </div>

  <!-- Toast Notifications (non-blocking feedback) -->
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

  <!-- Mobile Bottom Navigation (Visible on screen < 768px) -->
  <nav id="mobile-bottom-nav" class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-[var(--surface)] border-t border-[var(--border-subtle)] px-2 py-2 flex items-center justify-around shadow-[0_-4px_16px_rgba(0,0,0,0.06)]">
    <button data-mobile-nav="dashboard" class="flex flex-col items-center gap-0.5 text-[10px] font-medium text-[var(--ink-secondary)]">
      <span class="text-base">🗺️</span>
      <span>Lộ trình</span>
    </button>
    <button data-mobile-nav="day-detail" class="flex flex-col items-center gap-0.5 text-[10px] font-medium text-[var(--ink-secondary)]">
      <span class="text-base">📖</span>
      <span>Bài học</span>
    </button>
    <button data-mobile-nav="error-log" class="flex flex-col items-center gap-0.5 text-[10px] font-medium text-[var(--ink-secondary)]">
      <span class="text-base">🎯</span>
      <span>Nhật ký</span>
    </button>
    <button data-mobile-nav="portfolio" class="flex flex-col items-center gap-0.5 text-[10px] font-medium text-[var(--ink-secondary)]">
      <span class="text-base">📁</span>
      <span>Hồ sơ</span>
    </button>
    <button data-mobile-nav="settings" class="flex flex-col items-center gap-0.5 text-[10px] font-medium text-[var(--ink-secondary)]">
      <span class="text-base">⚙️</span>
      <span>Cài đặt</span>
    </button>
  </nav>

<!-- Application Entry Point -->
  <script type="module" src="src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
